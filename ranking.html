<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ranking – FitLegend</title>
    <link rel="icon" type="image/x-icon" href="imgs/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700&display=swap"
        rel="stylesheet" />
    <style>
        :root {
            --bg: #050f0f;
            --bg2: #071515;
            --card: #0c1f1f;
            --card2: #0f2525;
            --accent: #00F5A0;
            --accent-glow: rgba(0, 245, 160, 0.18);
            --accent-glow2: rgba(0, 245, 160, 0.06);
            --gold: #FFD700;
            --silver: #C0C0C0;
            --bronze: #CD7F32;
            --text: #f0faf5;
            --muted: #6b9e8a;
            --border: rgba(0, 245, 160, 0.12);
            --xp: #a78bfa;
            --streak: #ff6b35;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
        }

        /* NAV */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 2.5rem;
            background: rgba(5, 15, 15, 0.7);
            backdrop-filter: blur(18px);
            border-bottom: 1px solid var(--border);
        }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: .6rem;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.6rem;
            letter-spacing: .08em;
            color: var(--accent);
            text-decoration: none;
        }

        .nav-logo span {
            color: var(--text);
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
        }

        .nav-links a {
            color: var(--muted);
            text-decoration: none;
            font-size: .9rem;
            font-weight: 500;
            transition: color .25s;
        }

        .nav-links a:hover {
            color: var(--accent);
        }

        .nav-cta {
            background: var(--accent);
            color: #050f0f;
            font-weight: 700;
            font-size: .88rem;
            padding: .5rem 1.3rem;
            border-radius: 100px;
            text-decoration: none;
            transition: transform .2s, box-shadow .2s;
        }

        .nav-cta:hover {
            transform: translateY(-1px);
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .nav-user {
            display: none;
            align-items: center;
            gap: .6rem;
            position: relative;
        }

        .nav-user.visible {
            display: flex;
        }

        .nav-user-btn {
            display: flex;
            align-items: center;
            gap: .6rem;
            cursor: pointer;
            background: none;
            border: none;
            padding: 0;
        }

        .nav-user-emoji {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), #007a50);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            flex-shrink: 0;
            border: 2px solid rgba(0, 245, 160, .3);
        }

        .nav-user-info {
            text-align: left;
        }

        .nav-user-name {
            font-size: .88rem;
            font-weight: 600;
            color: var(--text);
            max-width: 120px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            display: block;
        }

        .nav-user-handle {
            font-size: .72rem;
            color: var(--muted);
            display: block;
        }

        .nav-dropdown {
            display: none;
            position: absolute;
            top: calc(100% + .8rem);
            right: 0;
            min-width: 200px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, .5);
            overflow: hidden;
            animation: fadeUp .2s ease both;
            z-index: 300;
        }

        .nav-dropdown.open {
            display: block;
        }

        .nav-dropdown-item {
            display: flex;
            align-items: center;
            gap: .8rem;
            padding: .85rem 1.2rem;
            color: var(--text);
            font-size: .9rem;
            font-weight: 500;
            cursor: pointer;
            transition: background .2s;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
            font-family: 'Outfit', sans-serif;
        }

        .nav-dropdown-item:hover {
            background: rgba(0, 245, 160, .06);
        }

        .nav-dropdown-item.danger {
            color: #ff6b6b;
        }

        .nav-dropdown-item.danger:hover {
            background: rgba(255, 107, 107, .06);
        }

        .nav-dropdown-divider {
            height: 1px;
            background: var(--border);
            margin: .3rem 0;
        }

        /* PAGE */
        .page {
            padding: 5.5rem 0 4rem;
            max-width: 700px;
            margin: 0 auto;
        }

        /* HEADER */
        .ranking-header {
            padding: 1.5rem 1.5rem 0;
            display: flex;
            align-items: center;
            gap: .8rem;
        }

        .ranking-header h1 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 2rem;
            letter-spacing: .06em;
        }

        .ranking-header p {
            color: var(--muted);
            font-size: .85rem;
            margin-top: .1rem;
        }

        /* TABS */
        .tabs {
            display: flex;
            gap: 0;
            padding: 1rem 1.5rem 0;
            border-bottom: 1px solid var(--border);
        }

        .tab-btn {
            flex: 1;
            padding: .7rem .5rem;
            font-family: 'Outfit', sans-serif;
            font-size: .85rem;
            font-weight: 600;
            color: var(--muted);
            background: none;
            border: none;
            border-bottom: 2px solid transparent;
            cursor: pointer;
            transition: color .2s, border-color .2s;
            white-space: nowrap;
        }

        .tab-btn.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }

        .tab-btn:hover:not(.active) {
            color: var(--text);
        }

        /* CONTENT */
        .tab-content {
            display: none;
            padding: 0 1.5rem 2rem;
        }

        .tab-content.active {
            display: block;
        }

        /* PODIUM */
        .podium {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 1rem;
            padding: 2rem 1rem 1.5rem;
        }

        .podium-col {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: .3rem;
        }

        .podium-avatar {
            font-size: 2rem;
        }

        .podium-name {
            font-size: .78rem;
            font-weight: 600;
            max-width: 70px;
            text-align: center;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .podium-name.me {
            color: var(--accent);
        }

        .podium-value {
            font-size: .72rem;
            color: var(--xp);
            font-weight: 600;
        }

        .podium-block {
            width: 70px;
            border-radius: 10px 10px 0 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            border: 1px solid;
        }

        .podium-block.gold {
            background: linear-gradient(180deg, rgba(255, 215, 0, .4), rgba(255, 215, 0, .15));
            border-color: rgba(255, 215, 0, .5);
            height: 110px;
        }

        .podium-block.silver {
            background: linear-gradient(180deg, rgba(192, 192, 192, .4), rgba(192, 192, 192, .15));
            border-color: rgba(192, 192, 192, .5);
            height: 82px;
        }

        .podium-block.bronze {
            background: linear-gradient(180deg, rgba(205, 127, 50, .4), rgba(205, 127, 50, .15));
            border-color: rgba(205, 127, 50, .5);
            height: 64px;
        }

        /* PLAYER LIST */
        .player-list {
            display: flex;
            flex-direction: column;
            gap: .6rem;
        }

        .player-tile {
            display: flex;
            align-items: center;
            gap: .8rem;
            padding: .9rem 1rem;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            transition: border-color .2s;
        }

        .player-tile.me {
            background: rgba(0, 245, 160, .06);
            border-color: rgba(0, 245, 160, .35);
        }

        .player-tile:hover {
            border-color: rgba(0, 245, 160, .2);
        }

        .player-pos {
            width: 24px;
            text-align: center;
            color: var(--muted);
            font-size: .85rem;
            font-weight: 600;
            flex-shrink: 0;
        }

        .player-avatar {
            font-size: 1.4rem;
            flex-shrink: 0;
        }

        .player-info {
            flex: 1;
            min-width: 0;
        }

        .player-name {
            font-size: .9rem;
            font-weight: 500;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .player-name.me {
            color: var(--accent);
            font-weight: 700;
        }

        .player-sub {
            display: flex;
            align-items: center;
            gap: .5rem;
            margin-top: .15rem;
        }

        .player-level {
            color: var(--muted);
            font-size: .78rem;
        }

        .player-streak {
            color: var(--streak);
            font-size: .78rem;
        }

        .player-xp {
            color: var(--xp);
            font-size: .9rem;
            font-weight: 700;
            flex-shrink: 0;
        }

        .player-xp.me {
            color: var(--accent);
        }

        .player-steps {
            text-align: right;
            flex-shrink: 0;
        }

        .player-steps-val {
            font-size: .9rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: .3rem;
        }

        .player-steps-val.me {
            color: var(--accent);
        }

        .player-steps-label {
            color: var(--muted);
            font-size: .7rem;
        }

        /* STATES */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4rem 0;
        }

        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin .8s linear infinite;
        }

        .empty {
            text-align: center;
            padding: 4rem 0;
            color: var(--muted);
        }

        .not-logged {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 60vh;
            text-align: center;
            gap: 1rem;
            padding: 2rem;
        }

        .not-logged h2 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 2.5rem;
            letter-spacing: .06em;
        }

        .not-logged p {
            color: var(--muted);
            max-width: 360px;
            line-height: 1.6;
        }

        .btn-login {
            background: var(--accent);
            color: #050f0f;
            font-weight: 700;
            font-size: 1rem;
            padding: .85rem 2rem;
            border-radius: 100px;
            border: none;
            cursor: pointer;
            font-family: 'Outfit', sans-serif;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            nav {
                padding: 1rem 1.5rem;
            }



            .tab-btn {
                font-size: .78rem;
                padding: .6rem .3rem;
            }
        }

        .nav-links-logged {
            display: none !important;
        }

        .nav-links-logged.visible {
            display: flex !important;
        }

        .nav-links-guest.hidden {
            display: none !important;
        }
    </style>
</head>

<body>

    <nav>
        <a href="index.html" class="nav-logo">⚔️ Fit<span>Legend</span></a>
        <ul class="nav-links nav-links-guest" id="nav-links-guest">

    <div class="page">
        <div id="not-logged" style="display:none" class="not-logged">
            <div style="font-size:3rem">🏆</div>
            <h2>INICIA SESIÓN</h2>
            <p>Necesitas una cuenta para ver el ranking. ¿Tienes lo que hace falta?</p>

        <div id="ranking-content" style="display:none">

                <div>
                    <h1>🏆 Ranking</h1>

                </div>

            <div class="tabs">
                <button class="tab-btn active" data-tab="weekly">Semanal</button>

                <button class="tab-btn" data-tab="steps">👟 Pasos</button>
            </div>

            <div class="tab-content active" id="tab-weekly">

    <!-- AUTH MODAL (mini) -->
    <div id="auth-modal-overlay"
        style="display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.75);backdrop-filter:blur(10px);align-items:center;justify-content:center;">
        <div
            style="background:var(--card);border:1px solid rgba(0,245,160,.2);border-radius:24px;padding:2.5rem;width:100%;max-width:420px;margin:1rem;position:relative;box-shadow:0 40px 80px rgba(0,0,0,.6);">
            <button onclick="document.getElementById('auth-modal-overlay').style.display='none'"
                style="position:absolute;top:1.2rem;right:1.5rem;color:var(--muted);font-size:1.5rem;cursor:pointer;background:none;border:none;">✕</button>
            <div style="font-family:'Bebas Neue',sans-serif;font-size:1.8rem;color:var(--accent);margin-bottom:.3rem;">
                ⚔️ Fit<span style="color:var(--text)">Legend</span></div>
            <p style="color:var(--muted);font-size:.88rem;margin-bottom:1.5rem;">Tu leyenda empieza aquí</p>
            <input id="m-email" type="email" placeholder="Email"
                style="background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:.85rem 1.1rem;color:var(--text);font-family:'Outfit',sans-serif;font-size:.95rem;outline:none;width:100%;margin-bottom:.8rem;" />
            <input id="m-pass" type="password" placeholder="Contraseña"
                style="background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:.85rem 1.1rem;color:var(--text);font-family:'Outfit',sans-serif;font-size:.95rem;outline:none;width:100%;margin-bottom:.8rem;" />
            <button id="m-submit"
                style="background:var(--accent);color:#050f0f;font-weight:700;font-size:1rem;padding:.9rem;border-radius:100px;border:none;cursor:pointer;font-family:'Outfit',sans-serif;width:100%;">Iniciar
                sesión</button>
            <p id="m-error"
                style="color:#ff6b6b;font-size:.82rem;text-align:center;margin-top:.5rem;min-height:1.2rem;"></p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
        import { getFirestore, collection, query, orderBy, limit, getDocs, doc, getDoc, updateDoc } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

        const app = initializeApp({ apiKey: "AIzaSyA_XCqGwo1eXEA5soSc6QTYgy9A6jNz-Gk", authDomain: "fitquest-48c1b.firebaseapp.com", projectId: "fitquest-48c1b", storageBucket: "fitquest-48c1b.firebasestorage.app", messagingSenderId: "328306509996", appId: "1:328306509996:web:0ad19ec3803acac6ddb709" });
        const auth = getAuth(app), db = getFirestore(app);
        const AVATARS = ['⚔️', '🥷', '🦁', '🐉', '🔥', '⚡', '🌟', '💎'];
        let myUid = null;
        const loaded = { weekly: false, monthly: false, global: false, steps: false };

        // Nav
        const navUser = document.getElementById('nav-user');
        const navDD = document.getElementById('nav-dropdown');
        document.getElementById('nav-user-btn').addEventListener('click', e => { e.stopPropagation(); navDD.classList.toggle('open'); });
        document.addEventListener('click', () => navDD.classList.remove('open'));
        document.getElementById('dd-logout').addEventListener('click', () => signOut(auth));

        // Auth modal
        function openModal() { document.getElementById('auth-modal-overlay').style.display = 'flex'; }
        document.getElementById('btn-open-auth').addEventListener('click', e => { e.preventDefault(); openModal(); });
        document.getElementById('btn-login-page')?.addEventListener('click', openModal);
        document.getElementById('m-submit').addEventListener('click', async () => {
            try { await signInWithEmailAndPassword(auth, document.getElementById('m-email').value, document.getElementById('m-pass').value); }
            catch (e) { document.getElementById('m-error').textContent = 'Email o contraseña incorrectos.'; }
        });

        // Tabs
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                btn.classList.add('active');
                const tab = btn.dataset.tab;
                document.getElementById('tab-' + tab).classList.add('active');
                if (!loaded[tab] && myUid) loadTab(tab);
            });
        });

        function weekStart() {
            const now = new Date();
            const day = now.getDay() || 7;
            const monday = new Date(now);
            monday.setDate(now.getDate() - day + 1);
            return monday.toISOString().slice(0, 10);
        }
        function monthStart() {
            const now = new Date();
            return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-01`;
        }

        async function ensurePeriodicFields() {
            if (!myUid) return;
            const wStart = weekStart(), mStart = monthStart();
            const snap = await getDoc(doc(db, 'users', myUid));
            const data = snap.data() || {};
            const updates = {};
            if ((data.weekStart || '') !== wStart) { updates.weeklyXP = 0; updates.weekStart = wStart; }
            if ((data.monthStart || '') !== mStart) { updates.monthlyXP = 0; updates.monthStart = mStart; }
            if (Object.keys(updates).length > 0) await updateDoc(doc(db, 'users', myUid), updates);
        }

        function formatSteps(n) {
            if (n >= 1000) {
                const k = Math.floor(n / 1000);
                const r = String(n % 1000).padStart(3, '0');
                return `${k}.${r}`;
            }
            return String(n);
        }

        async function loadTab(tab) {
            loaded[tab] = true;
            const fieldMap = { weekly: 'weeklyXP', monthly: 'monthlyXP', global: 'totalXP', steps: 'todaySteps' };
            const isSteps = tab === 'steps';
            const field = fieldMap[tab];
            const container = document.getElementById('tab-' + tab);
            container.innerHTML = '<div class="loading"><div class="spinner"></div></div>';

            try {
                const q = query(collection(db, 'users'), orderBy(field, 'desc'), limit(50));
                const snap = await getDocs(q);
                const players = snap.docs.map(d => {
                    const data = d.data();
                    return {
                        uid: d.id,
                        name: data.name || 'Guerrero',
                        avatar: Math.min(data.avatar || 0, AVATARS.length - 1),
                        level: data.level || 1,
                        streak: data.streak || 0,
                        stepStreak: data.stepStreak || 0,
                        xp: data[field] || 0,
                        steps: data.todaySteps || 0,
                        isMe: d.id === myUid,
                    };
                });

                if (players.length === 0) {
                    container.innerHTML = '<div class="empty">No hay datos aún</div>';
                    return;
                }

                let html = '';

                // Podium (top 3)
                if (players.length >= 3) {
                    const order = [1, 0, 2]; // silver, gold, bronze display order
                    const medals = ['🥇', '🥈', '🥉'];
                    const blockClass = ['gold', 'silver', 'bronze'];
                    html += '<div class="podium">';
                    for (const i of order) {
                        const p = players[i];
                        const emoji = AVATARS[p.avatar];
                        const value = isSteps ? formatSteps(p.steps) + ' 👟' : p.xp + ' XP';
                        html += `
            <div class="podium-col">
              <div class="podium-avatar">${emoji}</div>
              <div class="podium-name ${p.isMe ? 'me' : ''}">${p.name.length > 8 ? p.name.slice(0, 8) + '…' : p.name}${p.isMe ? ' (tú)' : ''}</div>
              <div class="podium-value">${value}</div>
              <div class="podium-block ${blockClass[i]}">${medals[i]}</div>
            </div>`;
                    }
                    html += '</div>';
                }

                // List (from position 4 onwards, or all if < 3)
                const startIdx = players.length >= 3 ? 3 : 0;
                html += '<div class="player-list">';
                for (let i = startIdx; i < players.length; i++) {
                    const p = players[i];
                    const emoji = AVATARS[p.avatar];
                    const streakVal = isSteps ? p.stepStreak : p.streak;
                    html += `
          <div class="player-tile ${p.isMe ? 'me' : ''}">
            <div class="player-pos">${i + 1}</div>
            <div class="player-avatar">${emoji}</div>
            <div class="player-info">
              <div class="player-name ${p.isMe ? 'me' : ''}">${p.name}${p.isMe ? ' (tú)' : ''}</div>
              <div class="player-sub">
                <span class="player-level">Nv.${p.level}</span>
                ${streakVal > 0 ? `<span class="player-streak">🔥 ${streakVal}</span>` : ''}
              </div>
            </div>
            ${isSteps
                            ? `<div class="player-steps">
                  <div class="player-steps-val ${p.isMe ? 'me' : ''}">👟 ${formatSteps(p.steps)}</div>
                  <div class="player-steps-label">pasos hoy</div>
                </div>`
                            : `<div class="player-xp ${p.isMe ? 'me' : ''}">${p.xp} XP</div>`
                        }
          </div>`;
                }
                html += '</div>';

                container.innerHTML = html;
            } catch (e) {
                container.innerHTML = '<div class="empty">Error cargando el ranking</div>';
                console.error(e);
            }
        }

        onAuthStateChanged(auth, async user => {
            if (user) {
                myUid = user.uid;
                document.querySelector('.nav-cta').style.display = 'none';
                navUser.classList.add('visible');
                document.getElementById('nav-links-guest').classList.add('hidden');
                document.getElementById('nav-links-logged').classList.add('visible');
                document.getElementById('auth-modal-overlay').style.display = 'none';

                const snap = await getDoc(doc(db, 'users', user.uid));
                if (snap.exists()) {
                    const d = snap.data();
                    document.getElementById('nav-user-emoji').textContent = AVATARS[Math.min(d.avatar || 0, 7)];
                    document.getElementById('nav-user-name').textContent = d.name || d.username || user.email.split('@')[0];
                    document.getElementById('nav-user-handle').textContent = d.username ? '@' + d.username : '';
                }

                document.getElementById('not-logged').style.display = 'none';
                document.getElementById('ranking-content').style.display = 'block';

                await ensurePeriodicFields();
                loadTab('weekly');
            } else {
                myUid = null;
                document.querySelector('.nav-cta').style.display = '';
                navUser.classList.remove('visible');
                document.getElementById('nav-links-guest').classList.remove('hidden');
                document.getElementById('nav-links-logged').classList.remove('visible');
                document.getElementById('not-logged').style.display = 'flex';
                document.getElementById('ranking-content').style.display = 'none';
            }
        });
    </script>
</body>

</html>
